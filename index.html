<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mega Player</title>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: "Segoe UI", Roboto, Arial, sans-serif; color: #fff; }
  /* Lecteur de Google Cast : vidéo plein écran, son habillage par défaut masqué (le nôtre est dessous). */
  cast-media-player {
    --background-color: #000;
    --splash-image: url("logo.png");
    --splash-size: contain;
    --logo-image: none;
    --progress-color: #7A2CFF;
    --buffering-color: #7A2CFF;
    --font-family: "Segoe UI", Roboto, Arial, sans-serif;
  }
  #attente { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: #000; z-index: 5; }
  #attente img { width: 60vw; max-width: 1100px; }
  #attente p { color: #b3b3b3; font-size: 2.2vw; margin: 1.5vw 0 0; }

  /* Fiche façon OQEE (07/10/2026), au chargement et en pause : visuel du programme en fond, logo de la chaîne en haut
     à droite, logo Mega Player en haut à gauche, bandeau bas = vignette, titre, sous-titre, barre du programme avec
     heures de début / fin et pastille LIVE. */
  #fiche { position: fixed; inset: 0; display: none; z-index: 4; background: #000; }
  #fiche.visible { display: block; }
  #fiche .fond { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .55; filter: blur(0px); }
  #fiche .fondAffiche { object-fit: contain; background: #000; }
  #fiche .voile { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,.15) 40%, rgba(0,0,0,.85) 100%); }
  #fiche .logo { position: absolute; top: 3vw; left: 4vw; width: 12vw; }
  #fiche .logoChaine { position: absolute; top: 3vw; right: 4vw; height: 7vw; max-width: 16vw; object-fit: contain; display: none; }
  #fiche .logoChaine.visible { display: block; }
  #fiche .affiche { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); height: 46vh; max-width: 40vw; object-fit: contain; border-radius: .8vw; box-shadow: 0 1vw 3vw rgba(0,0,0,.7); display: none; }
  #fiche .affiche.visible { display: block; }
  #fiche .bandeau { position: absolute; left: 6vw; right: 6vw; bottom: 7vh; }
  #fiche .ligne { display: flex; align-items: flex-end; gap: 1.6vw; }
  #fiche .vignette { width: 10vw; height: 5.6vw; object-fit: cover; border-radius: .4vw; background: #222; flex: none; display: none; }
  #fiche .vignette.visible { display: block; }
  #fiche .titre { font-size: 3vw; font-weight: 600; line-height: 1.15; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
  #fiche .sous { font-size: 1.7vw; color: #e4e4e4; margin-top: .4vw; text-shadow: 0 2px 10px rgba(0,0,0,.8); }
  #fiche .etat { font-size: 1.4vw; letter-spacing: .14em; text-transform: uppercase; color: #c9a7ff; margin-bottom: .6vw; }
  #fiche .barre { position: relative; height: .45vw; background: rgba(255,255,255,.35); border-radius: .3vw; margin-top: 1.4vw; }
  #fiche .barre .avancement { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #ff6a3d; border-radius: .3vw; }
  #fiche .barre .curseur { position: absolute; top: 50%; width: 1.3vw; height: 1.3vw; margin-left: -.65vw; transform: translateY(-50%); border-radius: 50%; background: #ff6a3d; box-shadow: 0 0 .6vw rgba(0,0,0,.6); left: 0; }
  #fiche .heures { display: flex; justify-content: space-between; align-items: center; margin-top: .8vw; font-size: 1.5vw; color: #f0f0f0; }
  #fiche .direct { display: none; align-items: center; gap: .5vw; }
  #fiche .direct.visible { display: inline-flex; }
  #fiche .direct i { width: .9vw; height: .9vw; border-radius: 50%; background: #ff3b30; display: inline-block; }

  /* Bandeau discret pendant la lecture d'une chaîne (4 s au changement). */
  #bandeau { position: fixed; left: 4vw; bottom: 5vw; z-index: 3; display: none; align-items: center; gap: 1.2vw; background: rgba(10,10,14,.78); border-radius: 1vw; padding: .9vw 1.6vw; backdrop-filter: blur(10px); }
  #bandeau.visible { display: flex; }
  #bandeau img { height: 3.2vw; max-width: 8vw; object-fit: contain; }
  #bandeau .t { font-size: 1.9vw; font-weight: 600; }
  #bandeau .s { font-size: 1.4vw; color: #c7c7c7; }

  /* Sous-titres rendus par la page (fichier WebVTT servi par le téléphone, relu pendant la conversion). */
  #soustitres { position: fixed; left: 8vw; right: 8vw; bottom: 6vh; z-index: 6; text-align: center; pointer-events: none; }
  #soustitres span { display: inline-block; background: rgba(0,0,0,.55); color: #fff; font-size: 2.7vw; line-height: 1.3; padding: .3vw 1vw; border-radius: .4vw; white-space: pre-line; text-shadow: 0 0 .3vw #000, 0 .15vw .3vw #000; }
</style>
</head>
<body>
<cast-media-player></cast-media-player>
<div id="attente"><img src="logo.png" alt="Mega Player"><p id="message">Prêt à diffuser</p></div>
<div id="fiche">
  <img class="fond" id="ficheFond" alt="">
  <div class="voile"></div>
  <img class="logo" src="logo.png" alt="">
  <img class="logoChaine" id="ficheLogoChaine" alt="">
  <img class="affiche" id="ficheAffiche" alt="">
  <div class="bandeau">
    <div class="etat" id="ficheEtat">Pause</div>
    <div class="ligne">
      <img class="vignette" id="ficheVignette" alt="">
      <div>
        <div class="titre" id="ficheTitre"></div>
        <div class="sous" id="ficheSous"></div>
      </div>
    </div>
    <div class="barre"><div class="avancement" id="ficheAvancement"></div><div class="curseur" id="ficheCurseur"></div></div>
    <div class="heures"><span id="ficheDebut"></span><span class="direct" id="ficheDirect"><i></i>LIVE</span><span id="ficheFin"></span></div>
  </div>
</div>
<div id="bandeau"><img id="bandeauLogo" src="icon.png" alt=""><div><div class="t" id="bandeauTitre"></div><div class="s" id="bandeauSous"></div></div></div>
<div id="soustitres"></div>
<script src="receiver.js"></script>
</body>
</html>
